<svg xmlns="http://www.w3.org/2000/svg" width="850" height="58" viewBox="0 0 850 58" fill="none" role="img" aria-label="TL;DR"><title>TL;DR</title><style>
text{font-family:'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif}
text:not([fill]){fill:#e6edf3}
.mono{font-family:'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace;white-space:pre}
.type{clip-path:inset(0 100% 0 0);animation:type .7s steps(14,end) forwards}
.muted{fill:#8b949e}
.dim{fill:#56606c}
.orange{fill:#ff8c42}
.fade{opacity:0;animation:fade .9s ease forwards}
.rise{opacity:0;animation:rise .8s cubic-bezier(.2,.8,.2,1) forwards}
.pop{opacity:0;transform-box:fill-box;transform-origin:center;animation:pop .6s cubic-bezier(.3,1.5,.5,1) forwards}
.grow{transform-box:fill-box;transform-origin:left center;transform:scaleX(0);animation:grow 1.4s cubic-bezier(.2,.8,.2,1) forwards}
.growy{transform-box:fill-box;transform-origin:center bottom;transform:scaleY(0);animation:growy 1.2s cubic-bezier(.2,.8,.2,1) forwards}
.pulse{animation:pulse 2.2s ease-in-out infinite}
.blink{animation:blink 1s step-end infinite}
.float{transform-box:fill-box;animation:float 4s ease-in-out infinite}
.flow{stroke-dasharray:6 7;animation:flow 1.1s linear infinite}
.glowpulse{animation:glowpulse 3s ease-in-out infinite}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 24s linear infinite}
.twinkle{animation:twinkle 3s ease-in-out infinite}
@keyframes fade{to{opacity:1}}
@keyframes type{to{clip-path:inset(0 0 0 0)}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
@keyframes grow{to{transform:scaleX(1)}}
@keyframes growy{to{transform:scaleY(1)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes blink{50%{opacity:0}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes flow{to{stroke-dashoffset:-13}}
@keyframes glowpulse{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes twinkle{0%,100%{opacity:.2}50%{opacity:1}}
@media (prefers-color-scheme: light){[fill="#0b1018"]{fill:#ffffff}[stroke="#0b1018"]{stroke:#ffffff}[stop-color="#0b1018"]{stop-color:#ffffff}[fill="#070a10"]{fill:#f6f8fa}[stroke="#070a10"]{stroke:#f6f8fa}[stop-color="#070a10"]{stop-color:#f6f8fa}[fill="#111823"]{fill:#f6f8fa}[stroke="#111823"]{stroke:#f6f8fa}[stop-color="#111823"]{stop-color:#f6f8fa}[fill="#0d121b"]{fill:#ffffff}[stroke="#0d121b"]{stroke:#ffffff}[stop-color="#0d121b"]{stop-color:#ffffff}[fill="#1f2a38"]{fill:#d0d7de}[stroke="#1f2a38"]{stroke:#d0d7de}[stop-color="#1f2a38"]{stop-color:#d0d7de}[fill="#161b22"]{fill:#ebedf0}[stroke="#161b22"]{stroke:#ebedf0}[stop-color="#161b22"]{stop-color:#ebedf0}[fill="#141c28"]{fill:#dde3e9}[stroke="#141c28"]{stroke:#dde3e9}[stop-color="#141c28"]{stop-color:#dde3e9}[fill="#0a0f17"]{fill:#e7ecf1}[stroke="#0a0f17"]{stroke:#e7ecf1}[stop-color="#0a0f17"]{stop-color:#e7ecf1}[fill="#1d2633"]{fill:#d8dee4}[stroke="#1d2633"]{stroke:#d8dee4}[stop-color="#1d2633"]{stop-color:#d8dee4}[fill="#161d29"]{fill:#d8dee4}[stroke="#161d29"]{stroke:#d8dee4}[stop-color="#161d29"]{stop-color:#d8dee4}[fill="#243042"]{fill:#c9d1d9}[stroke="#243042"]{stroke:#c9d1d9}[stop-color="#243042"]{stop-color:#c9d1d9}[fill="#2b3646"]{fill:#bfc8d2}[stroke="#2b3646"]{stroke:#bfc8d2}[stop-color="#2b3646"]{stop-color:#bfc8d2}[fill="#0b111a"]{fill:#e6eaef}[stroke="#0b111a"]{stroke:#e6eaef}[stop-color="#0b111a"]{stop-color:#e6eaef}[fill="#1a1109"]{fill:#fff1e6}[stroke="#1a1109"]{stroke:#fff1e6}[stop-color="#1a1109"]{stop-color:#fff1e6}[fill="#1d1712"]{fill:#f1e6dc}[stroke="#1d1712"]{stroke:#f1e6dc}[stop-color="#1d1712"]{stop-color:#f1e6dc}[fill="#2a1a0c"]{fill:#f1e6dc}[stroke="#2a1a0c"]{stroke:#f1e6dc}[stop-color="#2a1a0c"]{stop-color:#f1e6dc}text:not(.mono)[fill="#e6edf3"],text.ink[fill="#e6edf3"],text:not(.mono) tspan[fill="#e6edf3"],text.ink tspan[fill="#e6edf3"]{fill:#1f2328}text:not(.mono)[fill="#c9d1d9"],text.ink[fill="#c9d1d9"],text:not(.mono) tspan[fill="#c9d1d9"],text.ink tspan[fill="#c9d1d9"]{fill:#424a53}text:not(.mono)[fill="#ffb067"],text.ink[fill="#ffb067"],text:not(.mono) tspan[fill="#ffb067"],text.ink tspan[fill="#ffb067"]{fill:#bc4c00}text:not(.mono)[fill="#ff8c42"],text.ink[fill="#ff8c42"],text:not(.mono) tspan[fill="#ff8c42"],text.ink tspan[fill="#ff8c42"]{fill:#d9480f}text:not(.mono)[fill="#8c8cff"],text.ink[fill="#8c8cff"],text:not(.mono) tspan[fill="#8c8cff"],text.ink tspan[fill="#8c8cff"]{fill:#5b5bd6}text:not(.mono)[fill="#c9cbff"],text.ink[fill="#c9cbff"],text:not(.mono) tspan[fill="#c9cbff"],text.ink tspan[fill="#c9cbff"]{fill:#4b4bc4}text:not(.mono)[fill="#a5d6ff"],text.ink[fill="#a5d6ff"],text:not(.mono) tspan[fill="#a5d6ff"],text.ink tspan[fill="#a5d6ff"]{fill:#0969da}text:not([fill]):not(.mono),text.ink:not([fill]){fill:#1f2328}svg text.muted,svg tspan.muted{fill:#57606a}svg text.dim,svg tspan.dim{fill:#6e7781}pattern path{stroke:#000}}</style><defs>
<linearGradient id="cardg" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#111823"/><stop offset="1" stop-color="#0d121b"/>
</linearGradient>
<linearGradient id="og" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#ff6a00"/><stop offset="1" stop-color="#ffb067"/>
</linearGradient>
<linearGradient id="bgg" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#0b1018"/><stop offset="1" stop-color="#070a10"/>
</linearGradient>
<radialGradient id="emberg" cx=".5" cy="1" r=".9">
  <stop offset="0" stop-color="#ff6a00" stop-opacity=".16"/><stop offset="1" stop-color="#ff6a00" stop-opacity="0"/>
</radialGradient>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
  <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<filter id="softglow" x="-50%" y="-50%" width="200%" height="200%">
  <feGaussianBlur stdDeviation="6"/>
</filter>
<pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
  <path d="M24 0H0V24" fill="none" stroke="#ffffff" stroke-opacity=".035"/>
</pattern>
</defs><rect x=".5" y=".5" width="849" height="57" rx="12" fill="url(#bgg)" stroke="#ff8c42" stroke-opacity=".45"/><rect x="1" y="1" width="848" height="56" rx="12" fill="url(#grid)"/><g class="pop"><rect x="14" y="15" width="54" height="28" rx="7" fill="url(#og)"/><text x="41" y="34" text-anchor="middle" font-size="12.5" font-weight="900" fill="#1a0d02">TL;DR</text></g><text x="80" y="33" font-size="10.5" font-weight="700" fill="#e6edf3" class="fade" style="animation-delay:0.10s">Software Developer</text><text x="189.60000000000002" y="33" font-size="12" class="dim">·</text><text x="198.60000000000002" y="33" font-size="10.5" font-weight="500" fill="#c9d1d9" class="fade" style="animation-delay:0.20s">📍 Noida</text><text x="245.50000000000003" y="33" font-size="12" class="dim">·</text><text x="254.50000000000003" y="33" font-size="10.5" font-weight="500" fill="#3fb950" class="fade" style="animation-delay:0.30s">🟢 Open to work</text><text x="341.3" y="33" font-size="12" class="dim">·</text><text x="350.3" y="33" font-size="10.5" font-weight="500" fill="#c9d1d9" class="fade" style="animation-delay:0.40s">356 contributions this year</text><text x="511.20000000000005" y="33" font-size="12" class="dim">·</text><text x="520.2" y="33" font-size="10.5" font-weight="500" fill="#ffb067" class="fade" style="animation-delay:0.50s">Now: Python, CSS3</text></svg>