ffb067" filter="url(#glow)"><animateMotion dur="1.6s" begin="0.80s" repeatCount="indefinite" path="M454,110 L566,110"/></circle><path d="M626,110 L738,110" stroke="#ff8c42" stroke-opacity=".25" stroke-width="3.6" fill="none"/><path d="M626,110 L738,110" stroke="#ff8c42" stroke-width="1.6" fill="none" class="flow"/><circle r="3.2" fill="#ffb067" filter="url(#glow)"><animateMotion dur="1.6s" begin="0.00s" repeatCount="indefinite" path="M626,110 L738,110"/></circle><circle r="3.2" fill="#ffb067" filter="url(#glow)"><animateMotion dur="1.6s" begin="0.80s" repeatCount="indefinite" path="M626,110 L738,110"/></circle><g class="pop" style="animation-delay:0.15s"><circle cx="80" cy="110" r="28" fill="#111823" stroke="#ff8c42" stroke-opacity=".6" filter="url(#glow)"/><rect x="66" y="99" width="28" height="18" rx="2" stroke="#58a6ff" fill="#58a6ff" fill-opacity=".2"/><path d="M62 119h36" stroke="#58a6ff" stroke-width="2"/></g><g class="rise" style="animation-delay:0.30s"><text x="80" y="158" text-anchor="middle" font-size="12" font-weight="700">Local</text><text x="80" y="172" text-anchor="middle" font-size="9.5" class="muted">Development</text></g><g class="pop" style="animation-delay:0.30s"><circle cx="252" cy="110" r="28" fill="#111823" stroke="#ff8c42" stroke-opacity=".6" filter="url(#glow)"/><rect x="240" y="98" width="24" height="24" rx="4" transform="rotate(45 252 110)" fill="#F05032"/><circle cx="249" cy="106" r="2.4" fill="#fff"/><circle cx="256" cy="114" r="2.4" fill="#fff"/><path d="M249 106L256 114" stroke="#fff" stroke-width="1.6"/></g><g class="rise" style="animation-delay:0.45s"><text x="252" y="158" text-anchor="middle" font-size="12" font-weight="700">Git</text><text x="252" y="172" text-anchor="middle" font-size="9.5" class="muted">Version Control</text></g><g class="pop" style="animation-delay:0.45s"><circle cx="424" cy="110" r="28" fill="#111823" stroke="#ff8c42" stroke-opacity=".6" filter="url(#glow)"/><g class="spin" style="animation-duration:6s"><circle cx="424" cy="110" r="10" stroke="#58a6ff" stroke-width="5" stroke-dasharray="4 3.85"/></g><circle cx="424" cy="110" r="4" fill="#58a6ff"/></g><g class="rise" style="animation-delay:0.60s"><text x="424" y="158" text-anchor="middle" font-size="12" font-weight="700">GitHub Actions</text><text x="424" y="172" text-anchor="middle" font-size="9.5" class="muted">CI/CD Pipeline</text></g><g class="pop" style="animation-delay:0.60s"><circle cx="596" cy="110" r="28" fill="#111823" stroke="#ff8c42" stroke-opacity=".6" filter="url(#glow)"/><rect x="584" y="110" width="7" height="7" fill="#2496ED"/><rect x="592" y="110" width="7" height="7" fill="#2496ED"/><rect x="600" y="110" width="7" height="7" fill="#2496ED"/><rect x="588" y="102" width="7" height="7" fill="#2496ED"/><rect x="596" y="102" width="7" height="7" fill="#2496ED"/><path d="M580 119h32c-3 6-10 8-18 8s-12-4-14-8z" fill="#2496ED"/></g><g class="rise" style="animation-delay:0.75s"><text x="596" y="158" text-anchor="middle" font-size="12" font-weight="700">Docker</text><text x="596" y="172" text-anchor="middle" font-size="9.5" class="muted">Containerization</text></g><g class="pop" style="animation-delay:0.75s"><circle cx="768" cy="110" r="28" fill="#111823" stroke="#ff8c42" stroke-opacity=".6" filter="url(#glow)"/><path d="M754 118a7 7 0 0 1 1-14a10 10 0 0 1 19-1a7 7 0 0 1 8 15z" fill="#FF9900" fill-opacity=".25" stroke="#FF9900" stroke-width="1.6"/><text x="769" y="115" text-anchor="middle" font-size="7.5" font-weight="800" fill="#FF9900">aws</text></g><g class="rise" style="animation-delay:0.90s"><text x="768" y="158" text-anchor="middle" font-size="12" font-weight="700">AWS</text><text x="768" y="172" text-anchor="middle" font-size="9.5" class="muted">Cloud Platform</text></g><g class="rise" style="animation-delay:1.00s"><rect x="140" y="192" width="130" height="30" rx="7" fill="url(#cardg)" stroke="#1f2a38" /><rect x="150" y="200" width="14" height="14" rx="3" fill="#FF9900" fill-opacity=".25" stroke="#FF9900"/><text x="172" y="205" font-size="10" font-weight="700">EC2</text><text x="172" y="216" font-size="8.5" class="muted">Virtual Server</text></g><g class="rise" style="animation-delay:1.10s"><rect x="282" y="192" width="130" height="30" rx="7" fill="url(#cardg)" stroke="#1f2a38" /><rect x="292" y="200" width="14" height="14" rx="3" fill="#FF9900" fill-opacity=".25" stroke="#FF9900"/><text x="314" y="205" font-size="10" font-weight="700">S3</text><text x="314" y="216" font-size="8.5" class="muted">File Storage</text></g><g class="rise" style="animation-delay:1.20s"><rect x="424" y="192" width="130" height="30" rx="7" fill="url(#cardg)" stroke="#1f2a38" /><rect x="434" y="200" width="14" height="14" rx="3" fill="#FF9900" fill-opacity=".25" stroke="#FF9900"/><text x="456" y="205" font-size="10" font-weight="700">Lambda</text><text x="456" y="216" font-size="8.5" class="muted">Serverless</text></g><g class="rise" style="animation-delay:1.30s"><rect x="566" y="192" width="130" height="30" rx="7" fill="url(#cardg)" stroke="#1f2a38" /><rect x="576" y="200" width="14" height="14" rx="3" fill="#FF9900" fill-opacity=".25" stroke="#FF9900"/><text x="598" y="205" font-size="10" font-weight="700">Monitoring</text><text x="598" y="216" font-size="8.5" class="muted">Logs &amp; Alerts</text></g></svg>