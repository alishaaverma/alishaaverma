<svg xmlns="http://www.w3.org/2000/svg" width="850" height="190" viewBox="0 0 850 190" fill="none" role="img" aria-label="Achievements"><title>Achievements</title><style>
text{font-family:'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif}
text:not([fill]){fill:#e6edf3}
.mono{font-family:'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace;white-space:pre}
.type{clip-path:inset(0 100% 0 0);animation:type .7s steps(14,end) forwards}
.muted{fill:#8b949e}
.dim{fill:#56606c}
.orange{fill:#ff8c42}
.fade{opacity:0;animation:fade .9s ease forwards}
.rise{opacity:0;animation:rise .8s cubic-bezier(.2,.8,.2,1) forwards}
.pop{opacity:0;transform-box:fill-box;transform-origin:center;animation:pop .6s cubic-bezier(.3,1.5,.5,1) forwards}
.grow{transform-box:fill-box;transform-origin:left center;transform:scaleX(0);animation:grow 1.4s cubic-bezier(.2,.8,.2,1) forwards}
.growy{transform-box:fill-box;transform-origin:center bottom;transform:scaleY(0);animation:growy 1.2s cubic-bezier(.2,.8,.2,1) forwards}
.pulse{animation:pulse 2.2s ease-in-out infinite}
.blink{animation:blink 1s step-end infinite}
.float{transform-box:fill-box;animation:float 4s ease-in-out infinite}
.flow{stroke-dasharray:6 7;animation:flow 1.1s linear infinite}
.glowpulse{animation:glowpulse 3s ease-in-out infinite}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 24s linear infinite}
.twinkle{animation:twinkle 3s ease-in-out infinite}
@keyframes fade{to{opacity:1}}
@keyframes type{to{clip-path:inset(0 0 0 0)}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
@keyframes grow{to{transform:scaleX(1)}}
@keyframes growy{to{transform:scaleY(1)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes blink{50%{opacity:0}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes flow{to{stroke-dashoffset:-13}}
@keyframes glowpulse{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes twinkle{0%,100%{opacity:.2}50%{opacity:1}}
</style><defs>
<linearGradient id="cardg" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#111823"/><stop offset="1" stop-color="#0d121b"/>
</linearGradient>
<linearGradient id="og" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#ff6a00"/><stop offset="1" stop-color="#ffb067"/>
</linearGradient>
<linearGradient id="bgg" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#0b1018"/><stop offset="1" stop-color="#070a10"/>
</linearGradient>
<radialGradient id="emberg" cx=".5" cy="1" r=".9">
  <stop offset="0" stop-color="#ff6a00" stop-opacity=".16"/><stop offset="1" stop-color="#ff6a00" stop-opacity="0"/>
</radialGradient>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
  <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<filter id="softglow" x="-50%" y="-50%" width="200%" height="200%">
  <feGaussianBlur stdDeviation="6"/>
</filter>
<pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
  <path d="M24 0H0V24" fill="none" stroke="#ffffff" stroke-opacity=".035"/>
</pattern>
</defs><rect x="0.5" y="0.5" width="849" height="189" rx="14" fill="url(#bgg)" stroke="#1f2a38"/><rect x="1" y="1" width="848" height="188" rx="14" fill="url(#grid)"/><rect x="1" y="86" width="848" height="104" rx="14" fill="url(#emberg)"/><g class="rise" style="animation-delay:0.00s"><rect x="24" y="20" width="30" height="30" rx="7" fill="#1a1109" stroke="#ff8c42" filter="url(#glow)"/><text x="39.0" y="40.0" text-anchor="middle" font-size="14" font-weight="700" class="orange">20</text><text x="66" y="41" font-size="19" font-weight="700">Achievements &amp; Certifications</text><text x="66" y="58" font-size="11" class="muted">Recognitions and milestones</text></g><g class="pop" style="animation-delay:0.20s"><polygon points="90.8,76.0 115.2,90.0 115.2,118.0 90.8,132.0 66.5,118.0 66.5,90.0" fill="#ff8c42" fill-opacity=".18" filter="url(#softglow)" class="glowpulse" style="animation-delay:0.0s"/><polygon points="90.8,76.0 115.2,90.0 115.2,118.0 90.8,132.0 66.5,118.0 66.5,90.0" fill="#111823" stroke="#ff8c42" stroke-width="1.6" filter="url(#glow)"/><polygon points="90.8,87.0 105.6,95.5 105.6,112.5 90.8,121.0 76.0,112.5 76.0,95.5" fill="#ff8c42" fill-opacity=".2" stroke="#ff8c42" stroke-opacity=".6"/><path transform="translate(83.83333333333333,97) scale(.875)" d="M8 0l2.4 5 5.6.7-4 3.9 1 5.4L8 12.4 3 15l1-5.4-4-3.9L5.6 5z" fill="#ff8c42"/></g><text x="91" y="152" text-anchor="middle" font-size="10.5" font-weight="600" class="rise" style="animation-delay:0.40s">Web Development</text><g class="pop" style="animation-delay:0.32s"><polygon points="224.5,76.0 248.9,90.0 248.9,118.0 224.5,132.0 200.1,118.0 200.1,90.0" fill="#58a6ff" fill-opacity=".18" filter="url(#softglow)" class="glowpulse" style="animation-delay:0.4s"/><polygon points="224.5,76.0 248.9,90.0 248.9,118.0 224.5,132.0 200.1,118.0 200.1,90.0" fill="#111823" stroke="#58a6ff" stroke-width="1.6" filter="url(#glow)"/><polygon points="224.5,87.0 239.3,95.5 239.3,112.5 224.5,121.0 209.7,112.5 209.7,95.5" fill="#58a6ff" fill-opacity=".2" stroke="#58a6ff" stroke-opacity=".6"/><path transform="translate(217.5,97) scale(.875)" d="M8 0l2.4 5 5.6.7-4 3.9 1 5.4L8 12.4 3 15l1-5.4-4-3.9L5.6 5z" fill="#58a6ff"/></g><text x="224" y="152" text-anchor="middle" font-size="10.5" font-weight="600" class="rise" style="animation-delay:0.52s">API Development</text><g class="pop" style="animation-delay:0.44s"><polygon points="358.2,76.0 382.5,90.0 382.5,118.0 358.2,132.0 333.8,118.0 333.8,90.0" fill="#f0b72f" fill-opacity=".18" filter="url(#softglow)" class="glowpulse" style="animation-delay:0.8s"/><polygon points="358.2,76.0 382.5,90.0 382.5,118.0 358.2,132.0 333.8,118.0 333.8,90.0" fill="#111823" stroke="#f0b72f" stroke-width="1.6" filter="url(#glow)"/><polygon points="358.2,87.0 373.0,95.5 373.0,112.5 358.2,121.0 343.4,112.5 343.4,95.5" fill="#f0b72f" fill-opacity=".2" stroke="#f0b72f" stroke-opacity=".6"/><path transform="translate(351.16666666666663,97) scale(.875)" d="M8 0l2.4 5 5.6.7-4 3.9 1 5.4L8 12.4 3 15l1-5.4-4-3.9L5.6 5z" fill="#f0b72f"/></g><text x="358" y="152" text-anchor="middle" font-size="10.5" font-weight="600" class="rise" style="animation-delay:0.64s">Cloud</text><text x="358" y="165" text-anchor="middle" font-size="10.5" font-weight="600" class="rise" style="animation-delay:0.64s">Fundamentals</text><g class="pop" style="animation-delay:0.56s"><polygon points="491.8,76.0 516.2,90.0 516.2,118.0 491.8,132.0 467.5,118.0 467.5,90.0" fill="#3fb950" fill-opacity=".18" filter="url(#softglow)" class="glowpulse" style="animation-delay:1.2000000000000002s"/><polygon points="491.8,76.0 516.2,90.0 516.2,118.0 491.8,132.0 467.5,118.0 467.5,90.0" fill="#111823" stroke="#3fb950" stroke-width="1.6" filter="url(#glow)"/><polygon points="491.8,87.0 506.6,95.5 506.6,112.5 491.8,121.0 477.0,112.5 477.0,95.5" fill="#3fb950" fill-opacity=".2" stroke="#3fb950" stroke-opacity=".6"/><path transform="translate(484.8333333333333,97) scale(.875)" d="M8 0l2.4 5 5.6.7-4 3.9 1 5.4L8 12.4 3 15l1-5.4-4-3.9L5.6 5z" fill="#3fb950"/></g><text x="492" y="152" text-anchor="middle" font-size="10.5" font-weight="600" class="rise" style="animation-delay:0.76s">Docker &amp; DevOps</text><g class="pop" style="animation-delay:0.68s"><polygon points="625.5,76.0 649.9,90.0 649.9,118.0 625.5,132.0 601.1,118.0 601.1,90.0" fill="#ff6a3d" fill-opacity=".18" filter="url(#softglow)" class="glowpulse" style="animation-delay:1.6s"/><polygon points="625.5,76.0 649.9,90.0 649.9,118.0 625.5,132.0 601.1,118.0 601.1,90.0" fill="#111823" stroke="#ff6a3d" stroke-width="1.6" filter="url(#glow)"/><polygon points="625.5,87.0 640.3,95.5 640.3,112.5 625.5,121.0 610.7,112.5 610.7,95.5" fill="#ff6a3d" fill-opacity=".2" stroke="#ff6a3d" stroke-opacity=".6"/><path transform="translate(618.5,97) scale(.875)" d="M8 0l2.4 5 5.6.7-4 3.9 1 5.4L8 12.4 3 15l1-5.4-4-3.9L5.6 5z" fill="#ff6a3d"/></g><text x="626" y="152" text-anchor="middle" font-size="10.5" font-weight="600" class="rise" style="animation-delay:0.88s">Problem Solving</text><g class="pop" style="animation-delay:0.80s"><polygon points="759.2,76.0 783.5,90.0 783.5,118.0 759.2,132.0 734.8,118.0 734.8,90.0" fill="#bc8cff" fill-opacity=".18" filter="url(#softglow)" class="glowpulse" style="animation-delay:2.0s"/><polygon points="759.2,76.0 783.5,90.0 783.5,118.0 759.2,132.0 734.8,118.0 734.8,90.0" fill="#111823" stroke="#bc8cff" stroke-width="1.6" filter="url(#glow)"/><polygon points="759.2,87.0 774.0,95.5 774.0,112.5 759.2,121.0 744.4,112.5 744.4,95.5" fill="#bc8cff" fill-opacity=".2" stroke="#bc8cff" stroke-opacity=".6"/><path transform="translate(752.1666666666666,97) scale(.875)" d="M8 0l2.4 5 5.6.7-4 3.9 1 5.4L8 12.4 3 15l1-5.4-4-3.9L5.6 5z" fill="#bc8cff"/></g><text x="759" y="152" text-anchor="middle" font-size="10.5" font-weight="600" class="rise" style="animation-delay:1.00s">Open Source</text><text x="759" y="165" text-anchor="middle" font-size="10.5" font-weight="600" class="rise" style="animation-delay:1.00s">Contributor</text></svg>