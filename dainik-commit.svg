="middle" font-size="25" font-weight="900" fill="#ece3cc" font-family="Georgia, 'Times New Roman', serif" class="rise" style="animation-delay:0.30s">chala</text><text x="425.0" y="170" text-anchor="middle" font-size="12" font-style="italic" fill="#e0584b" font-family="Georgia, 'Times New Roman', serif" class="fade" style="animation-delay:0.50s">Is hafte 17 contributions · saal bhar mein 356 · 20 repos</text><line x1="24" y1="186" x2="826" y2="186" stroke="#ece3cc" stroke-width=".6"/><text x="24" y="204" font-size="11" font-weight="800" fill="#e0584b" font-family="Georgia, 'Times New Roman', serif" letter-spacing="1">MUKHYA SAMACHAR</text><text x="24" y="222" font-size="10.5" fill="#ece3cc" font-family="Georgia, 'Times New Roman', serif" class="fade" style="animation-delay:0.60s">NOIDA, 01 November: Sootron ke mutabik Alisha ne aaj 0</text><text x="24" y="236" font-size="10.5" fill="#ece3cc" font-family="Georgia, 'Times New Roman', serif" class="fade" style="animation-delay:0.65s">aur kal 0 contributions kiye. Sabse taaza commit</text><text x="24" y="250" font-size="10.5" fill="#ece3cc" font-family="Georgia, 'Times New Roman', serif" class="fade" style="animation-delay:0.70s">&quot;fixed the small issues&quot; portfolio repo mein darj hua.</text><text x="24" y="264" font-size="10.5" fill="#ece3cc" font-family="Georgia, 'Times New Roman', serif" class="fade" style="animation-delay:0.75s">Taaza repo &#x27;portfolio&#x27; (TypeScript) ne bhi dhyan</text><text x="24" y="278" font-size="10.5" fill="#ece3cc" font-family="Georgia, 'Times New Roman', serif" class="fade" style="animation-delay:0.80s">kheencha. Is hafte ka score 17 tak pahunch gaya hai,</text><text x="24" y="292" font-size="10.5" fill="#ece3cc" font-family="Georgia, 'Times New Roman', serif" class="fade" style="animation-delay:0.85s">aur jaankaar kehte hain ki silsila jaari rahega.</text><line x1="330" y1="194" x2="330" y2="340" stroke="#8f846d" stroke-width=".8"/><text x="346" y="204" font-size="11" font-weig