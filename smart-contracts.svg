ll:#424a53}text:not(.mono)[fill="#ffb067"],text.ink[fill="#ffb067"],text:not(.mono) tspan[fill="#ffb067"],text.ink tspan[fill="#ffb067"]{fill:#bc4c00}text:not(.mono)[fill="#ff8c42"],text.ink[fill="#ff8c42"],text:not(.mono) tspan[fill="#ff8c42"],text.ink tspan[fill="#ff8c42"]{fill:#d9480f}text:not(.mono)[fill="#8c8cff"],text.ink[fill="#8c8cff"],text:not(.mono) tspan[fill="#8c8cff"],text.ink tspan[fill="#8c8cff"]{fill:#5b5bd6}text:not(.mono)[fill="#c9cbff"],text.ink[fill="#c9cbff"],text:not(.mono) tspan[fill="#c9cbff"],text.ink tspan[fill="#c9cbff"]{fill:#4b4bc4}text:not(.mono)[fill="#a5d6ff"],text.ink[fill="#a5d6ff"],text:not(.mono) tspan[fill="#a5d6ff"],text.ink tspan[fill="#a5d6ff"]{fill:#0969da}text:not([fill]):not(.mono),text.ink:not([fill]){fill:#1f2328}svg text.muted,svg tspan.muted{fill:#57606a}svg text.dim,svg tspan.dim{fill:#6e7781}pattern path{stroke:#000}}</style><defs>
