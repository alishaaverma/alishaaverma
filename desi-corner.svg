<svg xmlns="http://www.w3.org/2000/svg" width="850" height="300" viewBox="0 0 850 300" fill="none" role="img" aria-label="Desi Dev Corner"><title>Desi Dev Corner</title><style>
text{font-family:'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif}
text:not([fill]){fill:#e6edf3}
.mono{font-family:'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace;white-space:pre}
.type{clip-path:inset(0 100% 0 0);animation:type .7s steps(14,end) forwards}
.muted{fill:#8b949e}
.dim{fill:#56606c}
.orange{fill:#ff8c42}
.fade{opacity:0;animation:fade .9s ease forwards}
.rise{opacity:0;animation:rise .8s cubic-bezier(.2,.8,.2,1) forwards}
.pop{opacity:0;transform-box:fill-box;transform-origin:center;animation:pop .6s cubic-bezier(.3,1.5,.5,1) forwards}
.grow{transform-box:fill-box;transform-origin:left center;transform:scaleX(0);animation:grow 1.4s cubic-bezier(.2,.8,.2,1) forwards}
.growy{transform-box:fill-box;transform-origin:center bottom;transform:scaleY(0);animation:growy 1.2s cubic-bezier(.2,.8,.2,1) forwards}
.pulse{animation:pulse 2.2s ease-in-out infinite}
.blink{animation:blink 1s step-end infinite}
.float{transform-box:fill-box;animation:float 4s ease-in-out infinite}
.flow{stroke-dasharray:6 7;animation:flow 1.1s linear infinite}
.glowpulse{animation:glowpulse 3s ease-in-out infinite}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 24s linear infinite}
.twinkle{animation:twinkle 3s ease-in-out infinite}
@keyframes fade{to{opacity:1}}
@keyframes type{to{clip-path:inset(0 0 0 0)}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
@keyframes grow{to{transform:scaleX(1)}}
@keyframes growy{to{transform:scaleY(1)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes blink{50%{opacity:0}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes flow{to{stroke-dashoffset:-13}}
@keyframes glowpulse{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes twinkle{0%,100%{opacity:.2}50%{opacity:1}}
@keyframes rain{from{transform:translate(0,-60px)}to{transform:translate(-18px,260px)}}.rain{animation:rain .9s linear infinite}@keyframes flash{0%,89%,93%,100%{opacity:0}90%,92%{opacity:.55}}.flash{opacity:0;animation:flash 6s linear infinite}@keyframes haze{0%,100%{transform:translateX(-30px)}50%{transform:translateX(30px)}}.haze{animation:haze 18s ease-in-out infinite}@keyframes smoke{0%{transform:translate(0,0);opacity:0}20%{opacity:.6}100%{transform:translate(8px,-34px);opacity:0}}.smoke{opacity:0;animation:smoke 3.4s ease-out infinite}@media (prefers-color-scheme: light){[fill="#0b1018"]{fill:#ffffff}[stroke="#0b1018"]{stroke:#ffffff}[stop-color="#0b1018"]{stop-color:#ffffff}[fill="#070a10"]{fill:#f6f8fa}[stroke="#070a10"]{stroke:#f6f8fa}[stop-color="#070a10"]{stop-color:#f6f8fa}[fill="#111823"]{fill:#f6f8fa}[stroke="#111823"]{stroke:#f6f8fa}[stop-color="#111823"]{stop-color:#f6f8fa}[fill="#0d121b"]{fill:#ffffff}[stroke="#0d121b"]{stroke:#ffffff}[stop-color="#0d121b"]{stop-color:#ffffff}[fill="#1f2a38"]{fill:#d0d7de}[stroke="#1f2a38"]{stroke:#d0d7de}[stop-color="#1f2a38"]{stop-color:#d0d7de}[fill="#161b22"]{fill:#ebedf0}[stroke="#161b22"]{stroke:#ebedf0}[stop-color="#161b22"]{stop-color:#ebedf0}[fill="#141c28"]{fill:#dde3e9}[stroke="#141c28"]{stroke:#dde3e9}[stop-color="#141c28"]{stop-color:#dde3e9}[fill="#0a0f17"]{fill:#e7ecf1}[stroke="#0a0f17"]{stroke:#e7ecf1}[stop-color="#0a0f17"]{stop-color:#e7ecf1}[fill="#1d2633"]{fill:#d8dee4}[stroke="#1d2633"]{stroke:#d8dee4}[stop-color="#1d2633"]{stop-color:#d8dee4}[fill="#161d29"]{fill:#d8dee4}[stroke="#161d29"]{stroke:#d8dee4}[stop-color="#161d29"]{stop-color:#d8dee4}[fill="#243042"]{fill:#c9d1d9}[stroke="#243042"]{stroke:#c9d1d9}[stop-color="#243042"]{stop-color:#c9d1d9}[fill="#2b3646"]{fill:#bfc8d2}[stroke="#2b3646"]{stroke:#bfc8d2}[stop-color="#2b3646"]{stop-color:#bfc8d2}[fill="#0b111a"]{fill:#e6eaef}[stroke="#0b111a"]{stroke:#e6eaef}[stop-color="#0b111a"]{stop-color:#e6eaef}[fill="#1a1109"]{fill:#fff1e6}[stroke="#1a1109"]{stroke:#fff1e6}[stop-color="#1a1109"]{stop-color:#fff1e6}[fill="#1d1712"]{fill:#f1e6dc}[stroke="#1d1712"]{stroke:#f1e6dc}[stop-color="#1d1712"]{stop-color:#f1e6dc}[fill="#2a1a0c"]{fill:#f1e6dc}[stroke="#2a1a0c"]{stroke:#f1e6dc}[stop-color="#2a1a0c"]{stop-color:#f1e6dc}text:not(.mono)[fill="#e6edf3"],text.ink[fill="#e6edf3"],text:not(.mono) tspan[fill="#e6edf3"],text.ink tspan[fill="#e6edf3"]{fill:#1f2328}text:not(.mono)[fill="#c9d1d9"],text.ink[fill="#c9d1d9"],text:not(.mono) tspan[fill="#c9d1d9"],text.ink tspan[fill="#c9d1d9"]{fill:#424a53}text:not(.mono)[fill="#ffb067"],text.ink[fill="#ffb067"],text:not(.mono) tspan[fill="#ffb067"],text.ink tspan[fill="#ffb067"]{fill:#bc4c00}text:not(.mono)[fill="#ff8c42"],text.ink[fill="#ff8c42"],text:not(.mono) tspan[fill="#ff8c42"],text.ink tspan[fill="#ff8c42"]{fill:#d9480f}text:not(.mono)[fill="#8c8cff"],text.ink[fill="#8c8cff"],text:not(.mono) tspan[fill="#8c8cff"],text.ink tspan[fill="#8c8cff"]{fill:#5b5bd6}text:not(.mono)[fill="#c9cbff"],text.ink[fill="#c9cbff"],text:not(.mono) tspan[fill="#c9cbff"],text.ink tspan[fill="#c9cbff"]{fill:#4b4bc4}text:not(.mono)[fill="#a5d6ff"],text.ink[fill="#a5d6ff"],text:not(.mono) tspan[fill="#a5d6ff"],text.ink tspan[fill="#a5d6ff"]{fill:#0969da}text:not([fill]):not(.mono),text.ink:not([fill]){fill:#1f2328}svg text.muted,svg tspan.muted{fill:#57606a}svg text.dim,svg tspan.dim{fill:#6e7781}pattern path{stroke:#000}}</style><defs>
<linearGradient id="cardg" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#111823"/><stop offset="1" stop-color="#0d121b"/>
</linearGradient>
<linearGradient id="og" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#ff6a00"/><stop offset="1" stop-color="#ffb067"/>
</linearGradient>
<linearGradient id="bgg" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#0b1018"/><stop offset="1" stop-color="#070a10"/>
</linearGradient>
<radialGradient id="emberg" cx=".5" cy="1" r=".9">
  <stop offset="0" stop-color="#ff6a00" stop-opacity=".16"/><stop offset="1" stop-color="#ff6a00" stop-opacity="0"/>
</radialGradient>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
  <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<filter id="softglow" x="-50%" y="-50%" width="200%" height="200%">
  <feGaussianBlur stdDeviation="6"/>
</filter>
<pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
  <path d="M24 0H0V24" fill="none" stroke="#ffffff" stroke-opacity=".035"/>
</pattern>
</defs><rect x="0.5" y="0.5" width="849" height="299" rx="14" fill="url(#bgg)" stroke="#1f2a38"/><rect x="1" y="1" width="848" height="298" rx="14" fill="url(#grid)"/><rect x="1" y="135" width="848" height="164" rx="14" fill="url(#emberg)"/><g class="rise" style="animation-delay:0.00s"><text x="24" y="41" font-size="19" font-weight="700">Desi Dev Corner</text><text x="24" y="58" font-size="11" class="muted">Aaj ka rashifal, the chai-o-meter and the mood of my commits · all live</text></g><g class="rise" style="animation-delay:0.30s"><rect x="24" y="70" width="330" height="206" rx="10" fill="url(#cardg)" stroke="#1f2a38" /><text x="40" y="100" font-size="26" fill="#ffb067" filter="url(#glow)">♍</text><text x="74" y="92" font-size="13.5" font-weight="800">Kanya Rashi</text><text x="74" y="107" font-size="9.5" class="muted">Aaj ka rashifal · 25 Oct 2026</text><text x="40" y="134" font-size="11" font-style="italic" fill="#c9d1d9">“Ketu hides your keys. Check .env before you blame</text><text x="40" y="150" font-size="11" font-style="italic" fill="#c9d1d9">the API.”</text><circle cx="44" cy="194" r="3" fill="#AA6746" class="" filter="url(#glow)"/><text x="54" y="198" font-size="10" class="muted">Lucky language</text><text x="338" y="198" text-anchor="end" font-size="10.5" font-weight="700" fill="#AA6746">Solidity</text><circle cx="44" cy="216" r="3" fill="#ffb067" class="" filter="url(#glow)"/><text x="54" y="220" font-size="10" class="muted">Shubh muhurat to push</text><text x="338" y="220" text-anchor="end" font-size="10.5" font-weight="700" fill="#ffb067">12:00 PM</text><circle cx="44" cy="238" r="3" fill="#ffb067" class="" filter="url(#glow)"/><text x="54" y="242" font-size="10" class="muted">Lucky repo</text><text x="338" y="242" text-anchor="end" font-size="10.5" font-weight="700" fill="#ffb067">profile-api</text></g><g class="rise" style="animation-delay:0.40s"><rect x="366" y="70" width="220" height="206" rx="10" fill="url(#cardg)" stroke="#1f2a38" /><text x="382" y="92" font-size="13.5" font-weight="800">Chai-o-meter</text><text x="382" y="107" font-size="9.5" class="muted">cups my last 7 days of code took</text><defs><clipPath id="kulhad"><path d="M388,150 h74 l-10,84 h-54 z"/></clipPath></defs><path d="M388,150 h74 l-10,84 h-54 z" fill="#5a2a14"/><g clip-path="url(#kulhad)"><rect x="388" y="154.0" width="74" height="84" fill="#c68642" class="growy" style="animation-delay:0.80s"/><rect x="388" y="154.0" width="74" height="3" fill="#e0b080" class="growy" style="animation-delay:0.80s"/></g><path d="M388,150 h74 l-10,84 h-54 z" stroke="#b5562b" stroke-width="2.5"/><ellipse cx="425.0" cy="150" rx="37.0" ry="5" fill="#3a1d0c" stroke="#b5562b" stroke-width="2"/><path d="M394,166 h62" stroke="#d9480f" stroke-opacity=".6" stroke-width="2"/><path d="M410,142 q-6,-9 0,-16 q6,-8 0,-16" stroke="#ffffff" stroke-opacity=".6" stroke-width="2" stroke-linecap="round" class="smoke" style="animation-delay:0.0s"/><path d="M425,142 q-6,-9 0,-16 q6,-8 0,-16" stroke="#ffffff" stroke-opacity=".6" stroke-width="2" stroke-linecap="round" class="smoke" style="animation-delay:1.1s"/><path d="M440,142 q-6,-9 0,-16 q6,-8 0,-16" stroke="#ffffff" stroke-opacity=".6" stroke-width="2" stroke-linecap="round" class="smoke" style="animation-delay:2.2s"/><text x="478" y="162" font-size="30" font-weight="800" fill="url(#og)">37</text><text x="478" y="178" font-size="10" fill="#c9d1d9">cups of chai ☕</text><text x="478" y="200" font-size="10.5" font-weight="700" fill="#ffb067">Kettle on full</text><text x="478" y="216" font-size="9" class="muted">70 contributions</text><text x="478" y="229" font-size="9" class="muted">2 after 10 PM</text><text x="476.0" y="264" text-anchor="middle" font-size="8.5" class="dim">1 cup per 2 contributions, +1 per late-night commit</text></g><g class="rise" style="animation-delay:0.50s"><rect x="598" y="70" width="228" height="206" rx="10" fill="url(#cardg)" stroke="#1f2a38" /><text x="614" y="92" font-size="13.5" font-weight="800">Commit Mood Ring</text><text x="614" y="107" font-size="9.5" class="muted">read from my last 45 commit messages</text><circle cx="652" cy="178" r="34" fill="#ff8c42" fill-opacity=".18" filter="url(#softglow)" class="glowpulse"/><circle cx="652" cy="178" r="36" stroke="#1d2633" stroke-width="12"/><circle cx="652" cy="178" r="36" stroke="#ff8c42" stroke-width="12" stroke-dasharray="190.7 226.2" stroke-dashoffset="-0.0" transform="rotate(-90 652 178)" class="fade" style="animation-delay:0.50s"/><circle cx="652" cy="178" r="36" stroke="#39c5cf" stroke-width="12" stroke-dasharray="6.4 226.2" stroke-dashoffset="-192.7" transform="rotate(-90 652 178)" class="fade" style="animation-delay:0.62s"/><circle cx="652" cy="178" r="36" stroke="#ff5e5e" stroke-width="12" stroke-dasharray="6.4 226.2" stroke-dashoffset="-201.1" transform="rotate(-90 652 178)" class="fade" style="animation-delay:0.74s"/><circle cx="652" cy="178" r="36" stroke="#bc8cff" stroke-width="12" stroke-dasharray="6.4 226.2" stroke-dashoffset="-209.4" transform="rotate(-90 652 178)" class="fade" style="animation-delay:0.86s"/><circle cx="652" cy="178" r="36" stroke="#3fb950" stroke-width="12" stroke-dasharray="6.4 226.2" stroke-dashoffset="-217.8" transform="rotate(-90 652 178)" class="fade" style="animation-delay:0.98s"/><circle cx="652" cy="178" r="21" fill="#ff8c42" fill-opacity=".22" stroke="#ff8c42" filter="url(#glow)"/><text x="652" y="185" text-anchor="middle" font-size="20">🚀</text><text x="614" y="246" font-size="12.5" font-weight="800" fill="#ff8c42">Shipping week</text><text x="614" y="261" font-size="9" class="muted">85% of my commits</text><circle cx="706" cy="144.5" r="3" fill="#ff8c42" class="" filter="url(#glow)"/><text x="714" y="148" font-size="9" fill="#c9d1d9">🚀 Shipping</text><text x="814" y="148" text-anchor="end" font-size="9" font-weight="700" fill="#ff8c42">85%</text><circle cx="706" cy="162.5" r="3" fill="#39c5cf" class="" filter="url(#glow)"/><text x="714" y="166" font-size="9" fill="#c9d1d9">🧹 Cleaning</text><text x="814" y="166" text-anchor="end" font-size="9" font-weight="700" fill="#39c5cf">4%</text><circle cx="706" cy="180.5" r="3" fill="#ff5e5e" class="" filter="url(#glow)"/><text x="714" y="184" font-size="9" fill="#c9d1d9">🐛 Bug hunting</text><text x="814" y="184" text-anchor="end" font-size="9" font-weight="700" fill="#ff5e5e">4%</text><circle cx="706" cy="198.5" r="3" fill="#bc8cff" class="" filter="url(#glow)"/><text x="714" y="202" font-size="9" fill="#c9d1d9">✨ Polishing</text><text x="814" y="202" text-anchor="end" font-size="9" font-weight="700" fill="#bc8cff">4%</text></g><g class="fade" style="animation-delay:1.20s"><circle cx="650.25" cy="288.5" r="3" fill="#3fb950" class="pulse"/><text x="659.25" y="292" font-size="9.5" class="dim mono">live · 25 Oct 2026, 00:54 IST</text></g></svg>