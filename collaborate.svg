bsite</text></g><g class="pop" style="animation-delay:0.55s"><rect x="24" y="110" width="118" height="24" rx="6" fill="#111823" stroke="#1f2a38"/><text x="83" y="126" text-anchor="middle" font-size="10.5" fill="#c9d1d9">Cloud Deployment</text></g><g class="pop" style="animation-delay:0.62s"><rect x="150" y="110" width="112" height="24" rx="6" fill="#111823" stroke="#1f2a38"/><text x="205" y="126" text-anchor="middle" font-size="10.5" fill="#c9d1d9">API Integration</text></g><g class="pop" style="animation-delay:0.60s"><rect x="638" y="78" width="188" height="46" rx="10" fill="url(#og)" filter="url(#glow)" class="glowpulse"/><text x="732" y="106" text-anchor="middle" font-size="14" font-weight="800" fill="#1a0d02">Start a Project  →</text></g><text x="24" y="158" font-size="11" class="muted fade" style="animation-delay:1.00s">Built with <tspan fill="#ff8c42">♥</tspan> using code, coffee and curiosity.</text><text x="826" y="158" text-anchor="end" font-size="11" class="muted fade" style="animation-delay:1.00s">Open to opportunities worldwide · @alishaaverma</text></svg>