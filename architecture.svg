><path d="M468,144 C488,144 475,98 500,98" stroke="#ff8c42" stroke-opacity=".25" stroke-width="3.6" fill="none"/><path d="M468,144 C488,144 475,98 500,98" stroke="#ff8c42" stroke-width="1.6" fill="none" class="flow"/><circle r="3.2" fill="#ffb067" filter="url(#glow)"><animateMotion dur="2.4s" begin="0.00s" repeatCount="indefinite" path="M468,144 C488,144 475,98 500,98"/></circle><path d="M468,160 C488,160 475,206 500,206" stroke="#58a6ff" stroke-opacity=".25" stroke-width="3.6" fill="none"/><path d="M468,160 C488,160 475,206 500,206" stroke="#58a6ff" stroke-width="1.6" fill="none" class="flow"/><circle r="3.2" fill="#ffb067" filter="url(#glow)"><animateMotion dur="2.4s" begin="0.00s" repeatCount="indefinite" path="M468,160 C488,160 475,206 500,206"/></circle><g class="rise" style="animation-delay:0.50s"><rect x="500" y="66" width="160" height="64" rx="9" fill="url(#cardg)" stroke="#ff8c42" stroke-opacity=".55"/><g class="float" style="animation-delay:0.5s"><g filter="url(#glow)"><polygon points="524,84.0 536,90.96 524,97.92 512,90.96" fill="#ff9d57" fill-opacity=".9" stroke="#ffb067" stroke-width=".8"/><polygon points="512,90.96 524,97.92 524,102.96 512,96.0" fill="#c2410c" fill-opacity=".85" stroke="#ffb067" stroke-width=".8"/><polygon points="536,90.96 524,97.92 524,102.96 536,96.0" fill="#7c2d12" fill-opacity=".9" stroke="#ffb067" stroke-width=".8"/></g></g><text x="544" y="86" font-size="12" font-weight="700">Database</text><text x="544" y="101" font-size="9.5" class="muted">MongoDB / PostgreSQL</text><text x="544" y="113" font-size="9.5" class="muted">Redis (Cache)</text></g><g class="rise" style="animation-delay:0.60s"><rect x="500" y="174" width="160" height="64" rx="9" fill="url(#cardg)" stroke="#58a6ff" stroke-opacity=".55"/><g class="float" style="animation-delay:0.6s"><g filter="url(#glow)"><polygon points="524,192.0 536,198.96 524,205.92 512,198.96" fill="#ff9d57" fill-opacity=".9" stroke="#ffb067" stroke-width=".8"/><polygon points="512,198.96 524,205.92 524,210.96 512,204.0" fill="#c2410c" fill-opacity=".85" stroke="#ffb067" stroke-width=".8"/><polygon points="536,198.96 524,205.92 524,210.96 536,204.0" fill="#7c2d12" fill-opacity=".9" stroke="#ffb067" stroke-width=".8"/></g></g><text x="544" y="194" font-size="12" font-weight="700">Cloud</text><text x="544" y="209" font-size="9.5" class="muted">AWS (S3, Lambda, EC2)</text></g><rect x="676" y="66" width="150" height="172" rx="10" fill="url(#cardg)" stroke="#1f2a38" /><g class="rise" style="animation-delay:0.60s"><circle cx="692" cy="88" r="5.5" stroke="#ff8c42" stroke-opacity=".6"/><circle cx="692" cy="88" r="2.4" fill="#ff8c42"/><text x="704" y="92" font-size="9.8" fill="#c9d1d9">Secure Auth (JWT/OAuth)</text></g><g class="rise" style="animation-delay:0.70s"><circle cx="692" cy="114" r="5.5" stroke="#ff8c42" stroke-opacity=".6"/><circle cx="692" cy="114" r="2.4" fill="#ff8c42"/><text x="704" y="118" font-size="9.8" fill="#c9d1d9">RESTful APIs</text></g><g class="rise" style="animation-delay:0.80s"><circle cx="692" cy="140" r="5.5" stroke="#ff8c42" stroke-opacity=".6"/><circle cx="692" cy="140" r="2.4" fill="#ff8c42"/><text x="704" y="144" font-size="9.8" fill="#c9d1d9">Database Optimization</text></g><g class="rise" style="animation-delay:0.90s"><circle cx="692" cy="166" r="5.5" stroke="#ff8c42" stroke-opacity=".6"/><circle cx="692" cy="166" r="2.4" fill="#ff8c42"/><text x="704" y="170" font-size="9.8" fill="#c9d1d9">File Storage (AWS S3)</text></g><g class="rise" style="animation-delay:1.00s"><circle cx="692" cy="192" r="5.5" stroke="#ff8c42" stroke-opacity=".6"/><circle cx="692" cy="192" r="2.4" fill="#ff8c42"/><text x="704" y="196" font-size="9.8" fill="#c9d1d9">Dockerized Deployment</text></g><g class="rise" style="animation-delay:1.10s"><circle cx="692" cy="218" r="5.5" stroke="#ff8c42" stroke-opacity=".6"/><circle cx="692" cy="218" r="2.4" fill="#ff8c42"/><text x="704" y="222" font-size="9.8" fill="#c9d1d9">Scalable Architecture</text></g></svg>